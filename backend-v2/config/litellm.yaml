# LiteLLM proxy configuration (template).
#
# The backend only ever calls the stable alias "coach-primary" — there is no
# user-facing provider picker. To switch providers or models, change
# `litellm_params` here and restart the proxy; no app or backend deploy needed.
#
# OPERATOR: put real keys in the environment (see docker-compose.yml), never in
# this file. Reference them below with os.environ/...

model_list:
  - model_name: coach-primary
    litellm_params:
      # Example default. Replace with your provider/model of choice.
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      # Optional: fallbacks are explicit and tested — do not add silent
      # cross-model fallbacks here without evaluating quality first.

general_settings:
  # Master key for the proxy's own admin UI/API. Override via LITELLM_MASTER_KEY.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Spend tracking per virtual key (the backend uses one virtual key).
  store_model_in_db: true

litellm_settings:
  success_callback: []
  failure_callback: []
