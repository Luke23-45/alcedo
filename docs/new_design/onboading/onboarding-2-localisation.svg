<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="393" height="852" viewBox="0 0 393 852" role="img" aria-labelledby="ttl dsc"
     font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
     text-rendering="optimizeLegibility" shape-rendering="geometricPrecision">

<title id="ttl">Alcedo — Onboarding 2 of 3, Localisation (dark)</title>
<desc id="dsc">Wizard page two: units, first weekday, language, theme swatches, color scheme and true-black rows, pager dots, Previous and Next actions. Settles in on load with a staggered rise; static after.</desc>

<defs>
  <clipPath id="frame"><rect x="0" y="0" width="393" height="852"/></clipPath>

  <!-- ══════ ENVIRONMENT ══════ -->
  <linearGradient id="gBg" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#0B0B0E"/><stop offset="0.5" stop-color="#050507"/><stop offset="1" stop-color="#08080B"/>
  </linearGradient>
  <radialGradient id="gAuraA" gradientUnits="userSpaceOnUse" cx="330" cy="200" r="280">
    <stop offset="0" stop-color="#AF52DE" stop-opacity="0.13"/><stop offset="1" stop-color="#AF52DE" stop-opacity="0"/></radialGradient>
  <radialGradient id="gAuraB" gradientUnits="userSpaceOnUse" cx="40" cy="700" r="280">
    <stop offset="0" stop-color="#0A84FF" stop-opacity="0.10"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>

  <!-- ══════ MATERIAL ══════ -->
  <linearGradient id="gCard" x1="0" y1="0" x2="0.45" y2="1">
    <stop offset="0" stop-color="#1F1F23"/><stop offset="0.55" stop-color="#17171A"/><stop offset="1" stop-color="#131316"/></linearGradient>
  <linearGradient id="gCardEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/></linearGradient>
  <linearGradient id="gBrand" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FFB03A"/><stop offset="0.45" stop-color="#FF6A3D"/><stop offset="1" stop-color="#FF2D55"/></linearGradient>
  <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>

  <!-- ══════ FILTERS ══════ -->
  <filter id="fCard" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.50"/></filter>
  <filter id="fBrand" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#FF2D55" flood-opacity="0.50"/></filter>
  <filter id="fKnob" x="-60%" y="-80%" width="220%" height="280%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/></filter>

  <!-- ══════ ICONS ══════ -->
  <g id="ic-dumbbell">
    <rect x="-13" y="-5.6" width="4.4" height="11.2" rx="1.8"/><rect x="-7.6" y="-8" width="3.8" height="16" rx="1.7"/>
    <rect x="-7.6" y="-1.9" width="15.2" height="3.8" rx="0.6"/><rect x="3.8" y="-8" width="3.8" height="16" rx="1.7"/>
    <rect x="8.6" y="-5.6" width="4.4" height="11.2" rx="1.8"/>
  </g>
  <g id="ic-cal" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <rect x="-7" y="-5" width="14" height="12" rx="2.5"/><path d="M-7 -1 H7"/><path d="M-3.5 -8 V-5.5 M3.5 -8 V-5.5"/>
  </g>
  <g id="ic-globe" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle r="7.2"/><ellipse rx="3" ry="7.2"/><line x1="-7.2" y1="0" x2="7.2" y2="0"/>
  </g>
  <path id="ic-chev" d="M-2 -4 L2 0 L-2 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Scroller fade: ThemeChooser seeds scroll (SwatchScroller); fade marks continuation. -->
  <linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#131316" stop-opacity="0"/><stop offset="1" stop-color="#131316" stop-opacity="1"/></linearGradient>
</defs>

<g clip-path="url(#frame)">

<!-- ░░ BACKGROUND ░░ -->
<rect width="393" height="852" fill="url(#gBg)"/>
<rect width="393" height="852" fill="url(#gAuraA)"/>
<rect width="393" height="852" fill="url(#gAuraB)"/>

<!-- ═══════════ 01 · STATUS BAR ═══════════ -->
<text x="66" y="36" font-size="16" font-weight="600" letter-spacing="-0.35" fill="#FFFFFF" text-anchor="middle">9:41</text>
<g fill="#FFFFFF">
  <rect x="281" y="27" width="3" height="4.5" rx="1.5"/><rect x="286" y="25" width="3" height="6.5" rx="1.5"/>
  <rect x="291" y="23" width="3" height="8.5" rx="1.5"/><rect x="296" y="20.5" width="3" height="11" rx="1.5"/>
</g>
<g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
  <path d="M306.28 23.78 A9.5 9.5 0 0 1 319.72 23.78"/><path d="M308.55 26.05 A6.3 6.3 0 0 1 317.45 26.05"/>
  <path d="M310.81 28.31 A3.1 3.1 0 0 1 315.19 28.31"/>
</g>
<circle cx="313" cy="30.8" r="1.3" fill="#FFFFFF"/>
<rect x="328" y="23" width="24" height="11" rx="3.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.38"/>
<rect x="329.8" y="24.8" width="18" height="7.4" rx="2" fill="#FFFFFF"/>
<path d="M353.6 26.4 C354.9 26.8 354.9 30.2 353.6 30.6 Z" fill="#FFFFFF" fill-opacity="0.42"/>
<rect x="133.5" y="11" width="126" height="37" rx="18.5" fill="#000000"/>
<circle cx="245.5" cy="29.5" r="6.2" fill="#0A0C10"/><circle cx="245.5" cy="29.5" r="3.1" fill="#121A24"/>
<circle cx="244.2" cy="28.2" r="1.05" fill="#3E6E9E" opacity="0.75"/>

<!-- ═══════════ 02 · HEADER ═══════════ -->
<g opacity="1">
  <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="1.2s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 18;0 0" keyTimes="0;1" dur="1.2s"
           calcMode="spline" keySplines="0.16 0.84 0.24 1" fill="freeze"/>
  <text x="196.5" y="112" font-size="24" font-weight="700" letter-spacing="-0.55" fill="#FFFFFF" text-anchor="middle">Localisation</text>
  <text x="196.5" y="138" font-size="13" font-weight="500" letter-spacing="0" fill="#98989F" text-anchor="middle">Set Alcedo&#x2019;s language and default weight units</text>
</g>

<!-- ═══════════ 03 · PREFS CARD ═══════════ -->
<!-- 58-pitch rows (tile 34 + 12 + divider + 12). Dividers inset to icon gutter: 78 = 32+34+12. -->
<g opacity="1" transform="translate(0,0)">
  <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="1.2s" begin="0.12s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 18;0 0" keyTimes="0;1" dur="1.2s" begin="0.12s"
           calcMode="spline" keySplines="0.16 0.84 0.24 1" fill="freeze"/>
<g filter="url(#fCard)"><rect x="16" y="165" width="361" height="184" rx="28" fill="url(#gCard)"/></g>
<rect x="16.5" y="165.5" width="360" height="183" rx="27.5" fill="none" stroke="url(#gCardEdge)"/>
<rect x="32" y="181" width="34" height="34" rx="10" fill="#FF9F0A" fill-opacity="0.15"/>
<use xlink:href="#ic-dumbbell" href="#ic-dumbbell" transform="translate(49,198) scale(0.72)" fill="#FFB84D"/>
<text x="78" y="194" font-size="13.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">Use imperial units</text>
<text x="78" y="214" font-size="10.5" font-weight="500" fill="#86868B">Use pounds in favour of kilograms</text>
<rect x="313" y="185" width="44" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.14"/>
<g filter="url(#fKnob)"><circle cx="326" cy="198" r="11" fill="#FFFFFF"/></g>
<line x1="78" y1="227" x2="357" y2="227" stroke="#FFFFFF" stroke-opacity="0.06"/>
<rect x="32" y="239" width="34" height="34" rx="10" fill="#0A84FF" fill-opacity="0.16"/>
<use xlink:href="#ic-cal" href="#ic-cal" transform="translate(49,256) scale(0.85)" color="#5EB0FF"/>
<text x="78" y="252" font-size="13.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">First day of the week</text>
<text x="78" y="272" font-size="10.5" font-weight="500" fill="#86868B">Set the first day of the week for the calendar</text>
<text x="333" y="260" font-size="12" font-weight="500" fill="#98989F" text-anchor="end">Monday</text>
<use xlink:href="#ic-chev" href="#ic-chev" transform="translate(345,256)" color="#48484A"/>
<line x1="78" y1="285" x2="357" y2="285" stroke="#FFFFFF" stroke-opacity="0.06"/>
<rect x="32" y="297" width="34" height="34" rx="10" fill="#AF52DE" fill-opacity="0.16"/>
<use xlink:href="#ic-globe" href="#ic-globe" transform="translate(49,314) scale(0.85)" color="#C77DFF"/>
<text x="78" y="310" font-size="13.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">Set language</text>
<text x="78" y="330" font-size="10.5" font-weight="500" fill="#86868B">Set your preferred language</text>
<text x="333" y="318" font-size="12" font-weight="500" fill="#98989F" text-anchor="end">System default</text>
<use xlink:href="#ic-chev" href="#ic-chev" transform="translate(345,314)" color="#48484A"/>
</g>

<!-- ═══════════ 04 · THEME CARD ═══════════ -->
<!-- Fresh install: seed 'default' so the Default pill carries the ring. Seeds scroll (fade); hidden: danger, trench, custom hue. -->
<g opacity="1" transform="translate(0,0)">
  <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="1.2s" begin="0.24s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 18;0 0" keyTimes="0;1" dur="1.2s" begin="0.24s"
           calcMode="spline" keySplines="0.16 0.84 0.24 1" fill="freeze"/>
<g filter="url(#fCard)"><rect x="16" y="361" width="361" height="191" rx="28" fill="url(#gCard)"/></g>
<rect x="16.5" y="361.5" width="360" height="190" rx="27.5" fill="none" stroke="url(#gCardEdge)"/>
<text x="36" y="387" font-size="13.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">Theme</text>
<rect x="36" y="399" width="72" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.10"/>
<rect x="33" y="396" width="78" height="38" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
<text x="72" y="419" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Default</text>
<circle cx="134" cy="415" r="14" fill="#0A76C2"/><circle cx="170" cy="415" r="14" fill="#0B2CC8"/>
<circle cx="206" cy="415" r="14" fill="#35E0D6"/><circle cx="242" cy="415" r="14" fill="#CE4A08"/>
<circle cx="278" cy="415" r="14" fill="#FFAE3C"/><circle cx="314" cy="415" r="14" fill="#2FD25C"/>
<rect x="305" y="399" width="56" height="32" fill="url(#gFade)"/>
<line x1="36" y1="447" x2="357" y2="447" stroke="#FFFFFF" stroke-opacity="0.06"/>
<text x="36" y="473" font-size="13.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">Color scheme</text>
<text x="333" y="473" font-size="12" font-weight="500" fill="#98989F" text-anchor="end">System</text>
<use xlink:href="#ic-chev" href="#ic-chev" transform="translate(345,469)" color="#48484A"/>
<line x1="36" y1="488" x2="357" y2="488" stroke="#FFFFFF" stroke-opacity="0.06"/>
<text x="36" y="510" font-size="13.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">Use true black for dark theme</text>
<rect x="313" y="497" width="44" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.14"/>
<g filter="url(#fKnob)"><circle cx="326" cy="510" r="11" fill="#FFFFFF"/></g>
<text x="36" y="533" font-size="10.5" font-weight="500" fill="#6C6C70">Pure black backgrounds in dark mode</text>
</g>

<!-- ═══════════ 05 · PAGER DOTS ═══════════ -->
